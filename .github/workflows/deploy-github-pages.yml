# ============================================================
# GitHub Pages deploy
# ============================================================
#
# LIVE SITE: https://tonypeonio.github.io/SQE-Website-Mines/
#
# GitHub Pages is currently set to "Deploy from a branch", which
# Jekyll-renders README.md whenever there is no index.html.
# This workflow builds the Next.js static export and publishes
# those files onto main so the real site is what visitors see.
#
# It also tries the official Actions Pages deploy. That path
# only succeeds after: Settings → Pages → Source: GitHub Actions
# ============================================================

name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build
        env:
          GITHUB_PAGES: "true"
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Verify export
        run: test -f out/index.html && test -f out/.nojekyll

      - name: Upload Pages artifact
        continue-on-error: true
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

      - name: Publish static export for branch-based Pages
        run: |
          set -euo pipefail
          cp -a out/. .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No static site changes to publish"
            exit 0
          fi
          git commit -m "Publish static site [skip ci]"
          git push

  deploy-actions:
    if: github.actor != 'github-actions[bot]'
    needs: build-and-publish
    continue-on-error: true
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
