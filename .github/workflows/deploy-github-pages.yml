# ============================================================
# GitHub Pages deploy
# ============================================================
#
# LIVE SITE: https://tonypeonio.github.io/SQE-Website-Mines/
#
# PUBLISH / UPDATE
#   GitHub → Actions → "Deploy GitHub Pages" → Run workflow
#
# TAKE SITE DOWN (while revising)
#   Repo → Settings → Pages → Build and deployment → Source: None
#   That stops the public site immediately. Local work is unaffected.
#
# BRING BACK ONLINE
#   Settings → Pages → Source: GitHub Actions
#   Then Actions → Deploy GitHub Pages → Run workflow
#
# OPTIONAL AUTO-DEPLOY
#   To republish on every push to main, change the job `if:` lines to:
#     if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
# ============================================================

name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # Manual "Run workflow" only (safe while revising). See header for auto-deploy.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build
        env:
          GITHUB_PAGES: "true"
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
